name: update-data
# 4시간마다(UTC 00/04/08/12/16/20시) FRED 스냅샷을 갱신하고, 내용이 바뀐 경우에만 커밋합니다.
# GitHub 저장소에 연결되어 Actions 가 켜져 있어야 동작합니다. (스케줄은 수 분~수십 분 지연될 수 있음)
on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: update-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/update-data.mjs
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      - name: Commit
        run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "chore: update data snapshot"
          git push
